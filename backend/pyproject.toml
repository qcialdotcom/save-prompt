[project]
name = "save-prompt"
version = "1.0.0"
description = "Save Prompt is a free browser extension to save, organize, search, and reuse your AI prompts for ChatGPT, Claude, Gemini and more. Local-first, no login required. Works on Chrome and Firefox."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
    "upstash-ratelimit>=1.2.0",
    "upstash-redis>=1.8.0",
    "uvicorn>=0.54.0",
]
