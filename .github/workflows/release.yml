name: Release Desktop App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win --x64
          - os: macos-latest
            platform: mac
            args: --mac --x64 --arm64
          - os: ubuntu-latest
            platform: linux
            args: --linux AppImage deb --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set app version and metadata
        working-directory: desktop
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          REPO_URL: https://github.com/${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.version = process.env.VERSION.replace(/^v/, "");

            // Metadata required by the Linux .deb target
            pkg.description = pkg.description || "Save and organize your prompts";
            pkg.homepage = pkg.homepage || process.env.REPO_URL;
            if (!pkg.author || typeof pkg.author === "string" || !pkg.author.email) {
              pkg.author = {
                name: process.env.OWNER,
                email: process.env.OWNER + "@users.noreply.github.com"
              };
            }

            pkg.build = pkg.build || {};
            pkg.build.linux = Object.assign(
              {
                category: "Utility",
                maintainer: pkg.author.name + " <" + pkg.author.email + ">"
              },
              pkg.build.linux || {}
            );

            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build app
        working-directory: desktop
        run: npm run build
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}

      - name: Package app
        working-directory: desktop
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
